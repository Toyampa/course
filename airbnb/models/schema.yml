models:
  - name: dim_listings_cleansed
    description: Cleansed table which contains Airbnb listings
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 1000
          severity: error
         
    columns:
      - name: listing_id
        description: PK for the listing
        data_tests:
          - unique
          - not_null

      - name: host_id
        description: FK to the host table
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_listings_cleansed')
                field: host_id
      
      - name: room_type
        description: Apartment Type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']

      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed__minimum_nights") }}'
        data_tests:
          - positive_values

  - name: dim_hosts_cleansed
    description: Cleansed table for Airbnb hosts
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        description: PK for the host.
        data_type: integer
        constraints:
          - type: not_null
        data_tests:
          - unique

      - name: host_name
        description: Name of the host.
        data_type: string
        contraints:
          - type: not_null
        data_tests:
          - not_null
      
      - name: is_superhost
        description: Flag for superhost.
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['t', 'f']

      - name: updated_at
        data_type: timestamp
      - name: created_at
        data_type: timestamp
    